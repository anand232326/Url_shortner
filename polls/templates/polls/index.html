<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TinyURL Shortener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 50px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        input[type="url"] { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007BFF; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; background: #e9ecef; padding: 10px; border-radius: 4px; word-break: break-all; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>URL Shortener</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="long_url">Enter Long URL:</label>
            <input type="url" id="long_url" name="long_url" placeholder="https://example.com" required>
            <button type="submit">Shorten URL</button>
        </form>

        {% if short_url %}
            <div class="result">
                <strong>Short URL:</strong> <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
            </div>
        {% endif %}

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
